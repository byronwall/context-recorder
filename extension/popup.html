<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, sans-serif; margin: 12px; width: 240px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #999; }
  .on .dot { background: #2ea043; }
  p { color: #666; margin: 8px 0 0; font-size: 12px; }
</style>
</head>
<body>
  <div id="status"><span class="dot"></span><span id="label">Checking…</span></div>
  <p>Sends clicked elements, console errors and failed requests to the Context Recorder app at 127.0.0.1:47823. Nothing leaves your machine.</p>
  <script src="popup.js"></script>
</body>
</html>
